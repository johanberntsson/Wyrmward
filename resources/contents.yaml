# Wyrmward's pictures, for the Ozmoo z6 build.
#
# Read by make_blorb.py: "python make_blorb.py resources" writes wyrmward.blb
# and the converted PNGs in pics/. The numbers match the old drakmagi.bli, so
# the game's @draw_picture calls are unchanged.
#
# Source images are found beside this file (srcdir defaults to the folder
# holding it); override with a "srcdir:" line if they live elsewhere.

blorb:  wyrmward.blb
outdir: pics

# id and file are mandatory; name, location, width and height are optional.
# width/height cap a single picture (preserving aspect ratio); omit them for
# the full 320x200 v6 screen. Inline room pictures stay short to leave room
# for text and the [More] prompt; the title fills the screen.
pictures:
  - id: 1
    file: title-v2.png
    name: title
    height: 180
    location: Introduction

  - id: 2
    file: demon.png
    name: demon
    height: 120
    location: The Crypt

  - id: 3
    file: dragon.png
    name: dragon
    height: 120
    location: Dragon Hall

  - id: 4
    file: pic5a.png
    name: hut
    height: 120
    location: Meadow (the hut)

  - id: 5
    file: teleport.png
    name: teleport
    height: 120
    location: On the Steppe

  - id: 6
    file: pic1a.png
    name: church
    height: 120
    location: Before a Temple

  - id: 7
    file: pic2a.png
    name: wave
    height: 120
    location: Beach

  - id: 8
    file: pic4a.png
    name: wood
    height: 120
    location: Forest Path

  - id: 9
    file: pic3a.png
    name: village
    height: 120
    location: Country Road

  - id: 10
    file: insidehut.png
    name: hut
    height: 120
    location: Remote Hut

  - id: 11
    file: spellbook.png
    name: spellbook
    height: 80

# Sound effects. sfrotz plays these out of the Blorb (Ozmoo's MEGA65 build takes
# the same wavs straight off this folder with make.rb's -asw instead). They are
# converted to AIFF on the way in: Blorb has no WAV chunk type.
sounds:
  - id: 3
    file: 003.wav
    name: intro.wav

  - id: 4
    file: 004.wav
    name: demon.wav

  - id: 5
    file: 005.wav
    name: dragon.wav

  - id: 6
    file: 006.wav
    name: eerie.wav

  - id: 7
    file: 007.wav
    name: snore.wav
